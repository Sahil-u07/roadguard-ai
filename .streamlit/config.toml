# Palette and font from the UI/UX Pro Max "Analytics Dashboard" profile: blue data, amber highlights, Inter.
[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E9EEF6"
textColor = "#0F172A"
borderColor = "#DBEAFE"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "medium"

[server]
# Phone videos are often over Streamlit's 200 MB default. Long videos are better run locally: the free cloud server has little memory.
maxUploadSize = 350
